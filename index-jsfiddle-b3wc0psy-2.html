<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Isra Boutique </title>

  <style>
    :root {
  --beige: #f3e8dc;
  --cream: #fcf8f3;
  --brown: #6b4b3e;
  --dark-brown: #3f2b24;
  --light-brown: #9a7969;
  --white: #ffffff;
  --border: #e4d6c8;
  }

  * {
    box-sizing: border-box;
      margin: 0;
        padding: 0;
          }

          html {
          scroll-behavior: smooth;
          }

          body {
          font-family: Georgia, "Times New Roman", serif;
          background: var(--cream);
          color: var(--dark-brown);
          }

          body.arabic {
          font-family: Arial, Tahoma, sans-serif;
          }

          button,
          input,
          select {
          font: inherit;
          }

          button {
          cursor: pointer;
          }

          /* =========================
          HEADER
          ========================= */

          header {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          z-index: 100;
          background: rgba(252, 248, 243, 0.95);
          backdrop-filter: blur(10px);
          border-bottom: 1px solid var(--border);
          }

          .header-inner {
          max-width: 1200px;
          margin: auto;
          padding: 17px 25px;

          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 20px;
          }

          .logo {
          font-size: 24px;
          font-weight: bold;
          letter-spacing: 1px;
          color: var(--brown);
          white-space: nowrap;
          }

          nav {
          display: flex;
          gap: 25px;
          }

          nav a {
          text-decoration: none;
          color: var(--dark-brown);
          font-size: 15px;
          }

          nav a:hover {
          color: var(--light-brown);
          }

          .header-actions {
          display: flex;
          align-items: center;
          gap: 12px;
          }

          .language {
          border: none;
          background: transparent;
          color: var(--brown);
          font-weight: bold;
          font-size: 13px;
          }

          .cart-button {
          border: none;
          background: var(--brown);
          color: var(--white);
          padding: 9px 15px;
          border-radius: 22px;
          }

          /* =========================
          HERO
          ========================= */

          .hero {
          min-height: 100vh;

          display: flex;
          align-items: center;
          justify-content: center;

          text-align: center;

          background:
          linear-gradient(
          rgba(50, 35, 28, 0.38),
          rgba(50, 35, 28, 0.38)
          ),
          url("images/hero.jpg")
          center / cover no-repeat;
          }

          .hero-content {
          color: var(--white);
          padding: 30px;
          }

          .hero h1 {
          font-size: clamp(45px, 8vw, 85px);
          letter-spacing: 2px;
          margin-bottom: 15px;
          }

          .hero p {
          font-size: 18px;
          letter-spacing: 1px;
          }

          .hero-button {
          display: inline-block;

          margin-top: 30px;

          padding: 13px 30px;

          background: var(--white);
          color: var(--brown);

          text-decoration: none;

          border-radius: 30px;
          }

          .hero-button:hover {
          opacity: 0.9;
          }

          /* =========================
          PRODUCTS SECTION
          ========================= */

          .section {
          max-width: 1200px;
          margin: auto;
          padding: 90px 25px;
          }

          .section-title {
          text-align: center;

          color: var(--brown);

          font-size: 36px;

          margin-bottom: 45px;
          }

          .products {
          display: grid;

          grid-template-columns: repeat(4, 1fr);

          gap: 25px;
          }

          .product-card {
          background: var(--white);

          border-radius: 12px;

          overflow: hidden;

          box-shadow:
          0 8px 25px rgba(70, 45, 35, 0.08);

          transition: transform 0.25s ease;
          }

          .product-card:hover {
          transform: translateY(-5px);
          }

          .product-image {
          display: block;

          width: 100%;

          aspect-ratio: 3 / 4;

          object-fit: cover;

          background: var(--beige);
          }

          .product-info {
          padding: 20px;

          text-align: center;
          }

          .product-name {
          font-size: 19px;

          margin-bottom: 7px;
          }

          .product-color {
          color: var(--light-brown);

          margin-bottom: 9px;
          }

          .product-price {
          font-weight: bold;

          margin-bottom: 15px;
          }

          .product-button {
          width: 100%;

          border: none;

          background: var(--brown);
          color: var(--white);

          padding: 11px 20px;

          border-radius: 25px;
          }

          .product-button:hover,
          .add-button:hover,
          .checkout-button:hover,
          .place-order:hover {
          opacity: 0.9;
          }

          /* =========================
          FOOTER
          ========================= */

          footer {
          background: var(--dark-brown);

          color: var(--white);

          text-align: center;

          padding: 35px 20px;
          }

          /* =========================
          MODALS
          ========================= */

          .overlay {
          position: fixed;

          inset: 0;

          z-index: 200;

          display: none;

          align-items: center;
          justify-content: center;

          padding: 20px;

          background: rgba(0, 0, 0, 0.52);
          }

          .overlay.active {
          display: flex;
          }

          .modal {
          position: relative;

          width: min(500px, 100%);

          max-height: 90vh;

          overflow-y: auto;

          background: var(--cream);

          border-radius: 16px;

          padding: 25px;
          }

          .close {
          position: absolute;

          top: 10px;
          right: 16px;

          border: none;

          background: transparent;

          color: var(--brown);

          font-size: 28px;

          line-height: 1;
          }

          .modal-image {
          display: block;

          width: 100%;

          aspect-ratio: 1 / 1;

          object-fit: cover;

          border-radius: 10px;

          margin-bottom: 20px;
          }

          .modal h2 {
          color: var(--brown);

          margin-bottom: 12px;
          }

          .modal p {
          margin: 9px 0;
          }

          .add-button {
          width: 100%;

          margin-top: 18px;

          border: none;

          background: var(--brown);

          color: var(--white);

          padding: 12px 20px;

          border-radius: 25px;
          }

          /* =========================
          CART
          ========================= */

          .cart-item {
          display: flex;

          justify-content: space-between;

          align-items: center;

          gap: 15px;

          padding: 15px 0;

          border-bottom: 1px solid var(--border);
          }

          .cart-item-info {
          flex: 1;
          }

          .remove-button {
          border: none;

          background: transparent;

          color: #a33;

          font-size: 13px;
          }

          .cart-total {
          text-align: right;

          font-size: 20px;

          font-weight: bold;

          margin-top: 20px;
          }

          .checkout-button {
          width: 100%;

          margin-top: 20px;

          border: none;

          background: var(--brown);

          color: var(--white);

          padding: 13px;

          border-radius: 25px;
          }

          .empty {
          text-align: center;

          padding: 30px 0;

          color: var(--light-brown);
          }

          /* =========================
          CHECKOUT
          ========================= */

          .checkout-form {
          margin-top: 20px;
          }

          .checkout-form label {
          display: block;

          margin: 15px 0 6px;
          }

          .checkout-form input,
          .checkout-form select {
          width: 100%;

          padding: 12px;

          border: 1px solid #d8c9bc;

          border-radius: 8px;

          background: var(--white);

          outline: none;
          }

          .checkout-form input:focus,
          .checkout-form select:focus {
          border-color: var(--brown);
          }

          .payment-box {
          margin-top: 20px;

          padding: 15px;

          background: var(--beige);

          border-radius: 10px;

          line-height: 1.7;
          }

          .place-order {
          width: 100%;

          margin-top: 20px;

          border: none;

          background: var(--brown);

          color: var(--white);

          padding: 13px;

          border-radius: 25px;

          font-size: 16px;
          }

          /* =========================
          MOBILE
          ========================= */

          @media (max-width: 850px) {

          nav {
          display: none;
          }

          .products {
          grid-template-columns: repeat(2, 1fr);

          gap: 14px;

          }

          }

          /* =========================
          SMALL MOBILE
          ========================= */

          @media (max-width: 500px) {

          .header-inner {
          padding: 14px;
          }

          .logo {
          font-size: 19px;
          }

          .header-actions {
          gap: 7px;
          }

          .cart-button {
          padding: 8px 11px;
          }

          .section {
          padding: 70px 14px;
          }

          .section-title {
          font-size: 29px;
          }

          .product-info {
          padding: 13px 9px;
          }

          .product-name {
          font-size: 16px;
          }

          .product-button {
          padding: 9px 5px;

          font-size: 13px;

          }

          .hero h1 {
          font-size: 42px;
          }

          .hero p {
          font-size: 16px;
          }

          }
}
  </style>

  
</head>
