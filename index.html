<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Israa Boutique</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="header-inner">

      <div class="logo">
        Israa Boutique
      </div>

      <nav>
        <a href="#home">Home</a>
        <a href="#best-sellers">Best Sellers</a>
      </nav>

      <div class="header-actions">

        <button
          class="language"
          onclick="toggleLanguage()"
        >
          AR | EN
        </button>

        <button
          class="cart-button"
          onclick="openCart()"
        >
          🛒 <span id="cartCount">0</span>
        </button>

      </div>

    </div>
  </header>


  <main>

    <!-- HERO -->

    <section
      class="hero"
      id="home"
    >

      <div class="hero-content">

        <h1>
          Israa Boutique
        </h1>

        <p>
          Elegant Hijabs, Made for You
        </p>

        <a
          href="#best-sellers"
          class="hero-button"
        >
          Shop Best Sellers
        </a>

      </div>

    </section>


    <!-- BEST SELLERS -->

    <section
      class="section"
      id="best-sellers"
    >

      <h2 class="section-title">
        Best Sellers
      </h2>

      <div
        class="products"
        id="productsContainer"
      ></div>

    </section>

  </main>


  <!-- PRODUCT MODAL -->

  <div
    class="overlay"
    id="productOverlay"
  >

    <div class="modal">

      <button
        class="close"
        onclick="closeProduct()"
      >
        ×
      </button>

      <img
        id="modalImage"
        class="modal-image"
        src=""
        alt=""
      >

      <h2 id="modalName"></h2>

      <p>
        <strong>
          Color:
        </strong>

        <span id="modalColor"></span>
      </p>

      <p>
        <strong>
          Price:
        </strong>

        <span id="modalPrice"></span>
        EGP
      </p>

      <button
        class="add-button"
        onclick="addCurrentProduct()"
      >
        Add to Cart
      </button>

    </div>

  </div>


  <!-- CART -->

  <div
    class="overlay"
    id="cartOverlay"
  >

    <div class="modal">

      <button
        class="close"
        onclick="closeCart()"
      >
        ×
      </button>

      <h2>
        Your Cart
      </h2>

      <div id="cartItems"></div>

      <div class="cart-total">

        Total:
        <span id="cartTotal">
          0
        </span>
        EGP

      </div>

      <button
        class="checkout-button"
        onclick="openCheckout()"
      >
        Checkout
      </button>

    </div>

  </div>


  <!-- CHECKOUT -->

  <div
    class="overlay"
    id="checkoutOverlay"
  >

    <div class="modal">

      <button
        class="close"
        onclick="closeCheckout()"
      >
        ×
      </button>

      <h2>
        Checkout
      </h2>

      <form
        class="checkout-form"
        onsubmit="placeOrder(event)"
      >

        <label for="customerName">
          Name
        </label>

        <input
          id="customerName"
          type="text"
          required
        >


        <label for="customerPhone">
          Phone
        </label>

        <input
          id="customerPhone"
          type="tel"
          required
        >


        <label for="governorate">
          Governorate
        </label>

        <select
          id="governorate"
          required
        >

          <option value="">
            Choose
          </option>

          <option value="Alexandria">
            Alexandria
          </option>

          <option value="Cairo">
            Cairo
          </option>

          <option value="Giza">
            Giza
          </option>

          <option value="Beheira">
            Beheira
          </option>

          <option value="Dakahlia">
            Dakahlia
          </option>

          <option value="Gharbia">
            Gharbia
          </option>

          <option value="Monufia">
            Monufia
          </option>

          <option value="Sharqia">
            Sharqia
          </option>

          <option value="Qalyubia">
            Qalyubia
          </option>

          <option value="Port Said">
            Port Said
          </option>

          <option value="Suez">
            Suez
          </option>

          <option value="Ismailia">
            Ismailia
          </option>

          <option value="Damietta">
            Damietta
          </option>

          <option value="Other">
            Other
          </option>

        </select>


        <label for="customerAddress">
          Address
        </label>

        <input
          id="customerAddress"
          type="text"
          required
        >


        <!-- PAYMENT -->

        <div class="payment-box">

          <strong>
            Payment Method
          </strong>

          <br>

          Vodafone Cash

          <br>

          <strong>
            01021755186
          </strong>

        </div>


        <button
          class="place-order"
          type="submit"
        >
          Send Order via WhatsApp
        </button>

      </form>

    </div>

  </div>


  <!-- FOOTER -->

  <footer>

    <p>
      © 2026 Israa Boutique
    </p>

  </footer>


  <!-- JAVASCRIPT -->

  <script src="script.js"></script>

</body>

</html>
